name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Fast, deterministic unit tests. No database or Redis — everything is mocked.
  # This is the job that should always be green; treat a failure here as a real bug.
  backend-unit:
    name: Backend — Unit Tests (no DB)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Pure unit tests mock Prisma and never connect, but `prisma validate`/`generate`
      # require the env var to be present. This dummy URL is never dialed.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      # Same reason, same dummy values as the integration job below.
      #
      # Four suites import a module that loads the real config, which refuses
      # to start without these and takes the whole suite with it. The giveaway
      # in the log is the shape of the failure: "291 passed, 0 failed, 4 suites
      # failed to RUN" — nothing was broken, four files could not boot. They
      # are never used to reach Razorpay: every test that touches it mocks the
      # adapter.
      JWT_SECRET: ci-test-secret-that-is-at-least-thirty-two-characters-long
      RAZORPAY_KEY_ID: rzp_test_ci_dummy_key
      RAZORPAY_KEY_SECRET: ci_dummy_razorpay_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Validate Prisma schema
        run: cd backend && npx prisma validate

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      # Non-blocking for now — the existing code has a lint backlog. Reports
      # issues without failing the build. Remove continue-on-error once clean.
      - name: Lint
        run: cd backend && npm run lint
        continue-on-error: true

      - name: Run unit tests (pure, mocked — no database needed)
        run: cd backend && npm test

  # Heavier integration tests that boot the server against a real Postgres.
  # Marked non-blocking (continue-on-error) until stabilized, so a flaky
  # integration run never masks a real unit-test failure. Remove
  # continue-on-error once these are reliably green.
  backend-integration:
    name: Backend — Integration Tests (Postgres)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: parkstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/parkstop_test
      JWT_SECRET: ci-test-secret-that-is-at-least-thirty-two-characters-long
      RAZORPAY_KEY_ID: rzp_test_ci_dummy_key
      RAZORPAY_KEY_SECRET: ci_dummy_razorpay_secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      # Build the test database the way production is built: by applying the
      # migrations. This used to be `prisma db push`, which writes
      # schema.prisma straight into the database and never runs a migration at
      # all — so a migration could be wrong, or missing entirely, and CI would
      # still be green. A migration had in fact never been applied to any
      # database before being merged.
      - name: Apply migrations to test DB
        run: cd backend && npx prisma migrate deploy

      # And prove the migrations actually produce schema.prisma. Without this,
      # someone editing the schema without writing a migration would get a
      # green build from the step above, since it would apply the old
      # migrations happily and simply not have the new column.
      #
      # --exit-code: 0 when the diff is empty, 2 when it is not.
      - name: Check migrations match the schema
        run: |
          cd backend
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          || {
            echo "::error::The database built from prisma/migrations does not match prisma/schema.prisma."
            echo "A schema change was committed without a migration, or a migration is wrong."
            echo "Run: npx prisma migrate dev --name <what_changed>   (against a LOCAL database)"
            exit 1
          }

      - name: Run integration tests
        run: cd backend && npm run test:integration

  frontend:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Uses `npm install` (not `npm ci`) on purpose: the frontend mixes an
      # Expo SDK 54 app with an SDK 55 CLI (@expo/cli@^55), so a strict lockfile
      # never resolves consistently across npm versions. `npm install` reconciles.
      # TODO: align the Expo tooling to a single SDK, then switch back to `npm ci`.
      - name: Install dependencies
        run: cd frontend && npm install

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit || true

      - name: Verify Expo config
        run: cd frontend && npx expo config --type public
